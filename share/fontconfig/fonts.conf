<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  PowerVLC bundled fontconfig configuration for Mac OS X.

  The contrib fontconfig is compiled with its default configuration file
  under the *build* prefix, which does not exist on the machines the bundle
  runs on: every fontconfig user (libass subtitles, libbluray BD-J font
  resolution) then printed "Fontconfig error: Cannot load default config
  file" on stderr and fell back to the compiled-in fallback configuration.
  src/darwin/specific.c points FONTCONFIG_FILE at this file instead.

  The directory list mirrors the fallback that contrib/src/fontconfig
  compiles in (rules.mak: with-default-fonts / with-add-fonts /
  with-cache-dir), so behaviour stays identical when this file is missing.
  Directories that do not exist on a given release are silently ignored.
-->
<fontconfig>
  <description>PowerVLC default configuration for Mac OS X</description>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>/Network/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir>~/Library/Caches/fontconfig</cachedir>
</fontconfig>
